services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./storage/dubbing.db
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_started
    command: ["uv", "run", "uvicorn", "src.main:app",
              "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./storage/dubbing.db
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      - redis
      - api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 2gb
    command: ["uv", "run", "celery", "-A", "src.worker.celery_app.celery_app",
              "worker", "--loglevel=info", "-c", "1"]
    restart: unless-stopped

  ui:
    build: .
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - api
    command: ["uv", "run", "streamlit", "run", "ui/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command: ["uv", "run", "python", "-m", "src.bot.discord_bot"]
    restart: unless-stopped
    profiles: ["bot"]

volumes:
  redis-data:
