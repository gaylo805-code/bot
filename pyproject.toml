[project]
name = "auto-dubbing"
version = "0.1.0"
description = "Auto Video Dubbing - tu dong long tieng video sang tieng Viet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "faster-whisper>=1.0.3",
    "litellm>=1.44.0",
    "openai>=1.40.0",
    "moviepy>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "srt>=3.5.3",
    "tenacity>=8.4.0",
    "httpx>=0.27.0",
    "streamlit>=1.37.0",
    "discord.py>=2.4.0",
    "edge-tts>=6.1.0",
    "deep-translator>=1.11.0",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src"]
# tests/* + ui/* (human UI) + discord_bot.py (live-gateway glue, needs a real
# bot token + Discord connection; its logic lives in tested helpers/client).
omit = ["tests/*", "ui/*", "src/bot/discord_bot.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
